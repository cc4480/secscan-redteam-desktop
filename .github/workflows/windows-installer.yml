# Build and publish the unsigned Windows installer from this repository.
#
# Why a separate workflow: release.yml packs npm tarballs for the harness packages
# (and targets the upstream `master` branch), and release-publish.yml publishes those
# tarballs. Neither produces a desktop installer. Until this workflow existed the only
# way to test a build on another machine was to package it locally and upload the
# binary by hand.
#
# Triggers:
#   - a `v*` tag: build, upload the installer as a run artifact, and attach it to the
#     GitHub release for that tag (creating a prerelease when none exists yet)
#   - manual dispatch: build and upload the run artifact; pass `release_tag` to also
#     attach the bytes to a release
#
# Unsigned by design. `package:desktop:win:x64:unsigned` is the packaging entry point
# that skips the EV signing stages, so this runs without any signing secret. A signed
# build must use `package:desktop:win:x64` on an operator's machine with the token.
#
# Runner selection: set the repository variable WINDOWS_RUNNER_LABELS to a JSON array
# (e.g. '["self-hosted","windows","x64"]') to build on a self-hosted machine; without it
# the job asks for windows-2022. The self-hosted branches below add the tool paths that
# a hosted image already provides: Git (checkout runs before any other step) and bash.
name: Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the installer to (optional, e.g. v0.1.7-rc.4)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: Package (unsigned)
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER_LABELS || '["windows-2022"]') }}
    timeout-minutes: 180
    steps:
      # Checkout needs `git` before any other step runs, and a self-hosted Windows
      # runner has none on PATH. A hosted image already provides it, so this only
      # prepends the paths when they resolve.
      - name: Put Git and its bash on PATH (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            "C:\tools\git\cmd" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "C:\tools\git\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The packaged Python runtime resolves an extension whose path crosses the
      # 260-character limit in deep checkouts; enabling long paths makes the smoke
      # independent of where the workspace lives. Hosted images already allow it.
      # Best effort: enabling long paths needs HKLM write, which a service-account
      # runner usually does not have. The machine may already allow long paths, and a
      # missing permission must not fail the build.
      - name: Enable long paths (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $current = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          if ($current -eq 1) { Write-Host 'long paths already enabled'; exit 0 }
          try {
            New-ItemProperty -Path $key -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force -ErrorAction Stop | Out-Null
            Write-Host 'long paths enabled'
          } catch {
            Write-Warning "could not enable long paths ($($_.Exception.Message)); continuing"
          }
          exit 0

      # Node first: pnpm/action-setup needs a node to run, and a self-hosted Windows
      # runner ships none. A hosted image has both, so the order is harmless there.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # A lockfile that disagrees with a workspace manifest must not fail the installer
      # lane: the packaging run only needs an installed tree, and the lockfile is
      # verified by the repository's own gates.
      #
      # cmd rather than bash: on a self-hosted Windows runner `bash` resolves to the
      # WSL launcher in System32, which fails when no distribution is installed. cmd
      # supports the same `||` fallback.
      - name: Install dependencies
        shell: cmd
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Build the monorepo
        shell: cmd
        run: pnpm run build

      - name: Build and package the installer
        shell: cmd
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Collect artifacts
        shell: powershell
        run: |
          $artifacts = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          New-Item -ItemType Directory -Force -Path 'dist-installer' | Out-Null
          Copy-Item -Path "$artifacts/*.exe" -Destination 'dist-installer/'
          Copy-Item -Path "$artifacts/*.blockmap" -Destination 'dist-installer/' -ErrorAction SilentlyContinue
          Get-ChildItem 'dist-installer'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 14

      # The release is driven through the REST API rather than `gh`: a self-hosted
      # Windows runner does not necessarily have the GitHub CLI installed.
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'windows-installer'; Accept = 'application/vnd.github+json' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $release = $null
          try { $release = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$env:TAG" } catch { }
          if (-not $release) {
            $body = @{
              tag_name = $env:TAG
              name = "SecScan RedTeam $env:TAG"
              prerelease = $true
              body = 'Unsigned Windows build produced by the Windows installer workflow.'
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "$api/releases"
            Write-Host "created release $env:TAG"
          } else {
            foreach ($asset in $release.assets) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/releases/assets/$($asset.id)" | Out-Null
            }
          }
          Get-ChildItem dist-installer -File | ForEach-Object {
            $name = [Uri]::EscapeDataString($_.Name)
            $uploadUri = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$name"
            Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $_.FullName -Uri $uploadUri | Out-Null
            Write-Host "uploaded $($_.Name)"
          }
