# The @secscan/redteam-desktop-bundle patch: the whole SecScan red team as ONE
# insert over whatever profile root it is composed into.
#
# Applied after dsh-base and dsh-web-app (bundle order in `dsh.profile.bundles`),
# and before the profile's own cordis.patch.yml - so a person can still override
# or disable any row by id in their own patch layer.
#
# Fifteen rows:
#   1. mcp-secscan      - the harness-NATIVE MCP client
#                         (@deepseek-ai/dsh-mcp-client) over Streamable HTTP.
#                         Tools appear namespaced mcp__secscan__scan_url,
#                         mcp__secscan__get_report, ...
#   2. mcp-seclayer     - the Seclayer MCP server (@seclayer/mcp) over stdio,
#                         keyed by the operator's own Seclayer API key.
#                         Tools appear namespaced mcp__seclayer__seclayer_scan,
#                         mcp__seclayer__seclayer_list_scans, ...
#   3. secscan-redteam  - @secscan/redteam-harness-plugin: the authorization
#                         gate as a `tools/pre-execute` hook, plus the
#                         engagement-protocol system-prompt section.
#   4. mcp-redteam-runner - the engagement ENGINE (battery, safety core, proof
#                         bundles, compliance packs) as a second MCP client, over
#                         the console's POST /mcp. Tools appear namespaced
#                         mcp__redteam__*.
#   5. mcp-alterego     - AlterEgo, the operator's PC bridge, as a fourth
#                         MCP client over Streamable HTTP: the chat
#                         surface's direct wire to the bridge's live tool
#                         registry, beside the runner's engagement-only
#                         bridge gate. Tools appear namespaced
#                         mcp__alterego__*.
#   6. agent-team       - the Agent Teams roster, durable peer mailbox and
#                         shared task DAG. This is what makes the engagement a
#                         TEAM: the session agent is the Lead and creates named
#                         teammates (recon, exploiter, reporter) that persist
#                         across crashes and restarts.
#   7. tool-agent-team  - the model-facing Team tools: spawn_teammate,
#                         send_message, list_agents, wait_agent,
#                         interrupt_agent, team_task_{create,list,get,update}.
#   8. ui-agent-team    - the Web UI for viewing the roster and task board.
#   9. command-redteam  - @secscan/redteam-command: the operator's RedTeam
#                         slash commands (/scan, /status, /report, /stop,
#                         /use) over the harness command registry.
#  10. speech-to-text   - the dictation provider registry
#                         (@deepseek-ai/dsh-experimental-speech-to-text):
#                         exact provider routing with no fallback; its
#                         volatile Settings (provider, language) are the
#                         operator's audio options.
#  11. speech-to-text-sensevoice - the local SenseVoice recognizer
#                         (provider id sensevoice-local): ONNX inference in
#                         a managed subprocess; models download only on the
#                         operator's explicit preparation, never on mount.
#  12. api-speech-to-text - the authenticated loopback channel carrying
#                         complete recordings from the client to the Host
#                         provider.
#  13. ui-voice-input   - the composer microphone control: record on click,
#                         transcribe on Stop, insert the text into the draft.
#                         Nothing reaches the model until the operator
#                         submits the draft as ordinary text.
#  14. llm-local        - @secscan/redteam-llm-local: the desktop's
#                         downloaded GGUF models as the harness `local`
#                         provider. The Host catalog lists them because
#                         they exist in the registry, whether or not the
#                         bundled llama-server is running; dispatch reads
#                         the endpoint the desktop publishes in
#                         server-state.json, and a stopped server fails
#                         with the Local Models start action.
#  15. llm-meta         - @secscan/redteam-llm-meta: Meta's Muse models
#                         as the harness `meta` provider. The Host catalog
#                         lists the four Meta models unconditionally;
#                         dispatch resolves the key per request through
#                         the credentials service (env-ref MODEL_API_KEY),
#                         and a missing key fails at dispatch with
#                         MISSING_CREDENTIAL naming the seating.
#
# Secrets are cordis-native: schemastery Config with env fallbacks.
# NEVER put a raw key in this file.

# Direct subagent delegation is disabled so that ALL delegation goes through the
# Team tools. A plain subagent is invisible to the roster, is not durable, and
# takes no part in the shared task board - so using it would fragment an
# engagement into untracked work. This mirrors the upstream Agent Teams profile
# (@deepseek-ai/dsh-experimental-agent-team-profile), which disables the same
# four rows for the same reason.
#
# To get fire-and-forget delegation back, set `disabled: false` on these rows in
# your own profile patch layer - but a red-team engagement wants the trail.
- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

# The same reasoning applies one layer out. `workflow`'s agent() starts fresh
# child runs that never appear on the roster and take no part in the board, so
# it is a second door to exactly the untracked work the four rows above close.
# It also has its own concurrency and total-agent caps and can fan out far wider
# than the team, which makes it the greater exposure of the two.
#
# Both rows go together: `tool-workflow` is the tool the model calls and
# `workflow-ptc` is the engine behind it. Disabling only the tool leaves a live
# backend, and only the engine leaves the tool present but broken.
#
# This is a real capability given up, not just a hole plugged: scripted
# mass-parallelism over many files or targets is gone. The engagement's own
# delegation covers the same ground and keeps the trail, which is the point.
- id: tool-workflow
  disabled: true

- id: workflow-ptc
  disabled: true

# The roster cap below is not the only fleet bound: the subagent service
# (inserted bare by dsh-base) defaults maxActiveSubagents to 8, and its
# activation pool refuses - does not queue - a spawn that would exceed it
# (ACTIVATION_LIMIT_REACHED; the roster row lands as failed). A 100-member
# roster would fail every spawn past 8 concurrently running members. Raise
# the active cap to the roster width so the whole fleet can work
# concurrently; the bounds that then bite first are the model provider's
# rate and token limits and the host's CPU and memory. The setting is
# volatile: an operator can still lower it live in Settings.
- id: subagent
  config:
    maxActiveSubagents: 100

- insert:
    - id: mcp-secscan
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: secscan
        transport: streamable-http
        url: https://secscan.us/api/mcp
        headers:
          # MCP-scope token - create at https://secscan.us/settings (AI editors).
          # Verified 2026-10-15: the settings page issues an ssk_-prefixed token FOR
          # MCP and the endpoint accepts it (initialize and get_account both HTTP 200).
          # Earlier revisions warned that ssk_ would be rejected - that is no longer
          # true. If a token is refused, suspect revocation or the wrong account, not
          # the prefix. If the token is UNSET the harness still starts and the
          # mcp__secscan__* tools simply do not appear - and the auth gate fails
          # closed anyway, so nothing aggressive can run without it.
          Authorization: !!js "'Bearer ' + (process.env.SECSCAN_MCP_TOKEN || '')"
        reconnect:
          enabled: true
          # Copied from the runner row: the schema maximum is the
          # supported equivalent of never giving up, so a mid-session
          # outage does not permanently unregister these tools.
          maxAttempts: 9007199254740991

    # The Seclayer service, over stdio. @seclayer/mcp serves stdio only, so
    # this row spawns it with npx; the version is pinned so an upstream
    # release can never silently change the tool surface under a saved
    # profile. Tools arrive namespaced mcp__seclayer__*: seclayer_scan,
    # seclayer_list_scans, seclayer_get_report - the operator's own service
    # scans against their own Seclayer account (a scan call spends a credit
    # there). This row adds reach, not authority: an engagement still scans
    # with the runner, never with this service.
    #
    # The key arrives by NAME only, through the mcp-client's secretEnv seam:
    # the credential vault writes SECLAYER_API_KEY into the app's process
    # env at startup, and the client resolves the named value into the
    # child's spawn env. The value never appears in this file or in any
    # composed config dump. If the key is UNSET the server exits at startup,
    # the harness still starts, and no mcp__seclayer__* tools appear - the
    # same failure shape as an unset SECSCAN_MCP_TOKEN above. If the key is
    # set but invalid, the tools appear and the server answers its scan
    # tools with an authentication error.
    - id: mcp-seclayer
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: seclayer
        transport: stdio
        command: !!js "process.platform === 'win32' ? 'npx.cmd' : 'npx'"
        args: ['-y', '@seclayer/mcp@1.0.0']
        secretEnv: ['SECLAYER_API_KEY']
        reconnect:
          enabled: true
          # Copied from the runner row: the schema maximum is the
          # supported equivalent of never giving up, so a mid-session
          # outage does not permanently unregister these tools.
          maxAttempts: 9007199254740991

    - id: secscan-redteam
      name: '@secscan/redteam-harness-plugin'
      config:
        # No plugin config needed. Verified domains come from the SecScan server
        # alone (list_verified_domains over MCP) - there is no allowlist env var,
        # deliberately: an env-var allowlist would be a way to assert ownership
        # locally instead of proving it with the server. The MCP token lives in
        # env SECSCAN_MCP_TOKEN.

    # The ENGAGEMENT ENGINE, over MCP. This is the row that actually combines the
    # product with the harness.
    #
    # secscan-redteam is two different things and it is worth keeping them
    # straight:
    #   - the SecScan scan service (row mcp-secscan above) is an MCP SERVER the
    #     harness calls for scan_url / get_report / domain verification;
    #   - the runner (@secscan/redteam-runner) is the engagement engine - the
    #     418-intent battery, the safety core, proof bundles, compliance packs -
    #     and it was an MCP CLIENT only, so there was nothing to connect to.
    #     runner/src/ui/mcp-endpoint.ts now serves POST /mcp on the console, so
    #     the engine is addressable the same way the scan service is.
    #
    # Tools arrive namespaced mcp__redteam__*: start_engagement, get_engagement,
    # get_feed, get_findings, get_proof, get_coverage, get_compliance,
    # escalate, reverify, abort_engagement, watch_profiles, watch_trigger.
    #
    # In the desktop application this console is BUNDLED and supervised, so an
    # operator installs nothing: apps/desktop/src/redteam-runner.ts starts the
    # packaged runner with the application's own Node runtime before the Host
    # composes this profile, waits for its MCP `initialize` reply, publishes the
    # loopback endpoint and a generated token into process.env (which is exactly
    # what the two `!!js` scalars below read), and stops it with the app. A
    # console that cannot start is a visible startup failure, not the silence
    # described next.
    #
    # An operator-set value always wins and suppresses the bundled console - that
    # person is driving a shared or remote one:
    #     REDTEAM_MCP_URL=https://console.example.test/mcp REDTEAM_UI_TOKEN=... \
    #       npx redteam-runner ui        # or their own console, 127.0.0.1:8787
    # If no console is reachable at all, this row fails plugin activation
    # instead of leaving a session with the mcp__redteam__* tools silently
    # unavailable. Its reconnect budget is the schema maximum, so a later
    # outage does not permanently unregister the tools.
    #
    # Safety: every tool delegates to the same handler the console UI calls, so
    # the safety core, launch validation, tier rules and approval logging all
    # still apply. This row adds reach, not authority.
    - id: mcp-redteam-runner
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: redteam
        transport: streamable-http
        # Loopback by default. The console binds 127.0.0.1 unless explicitly
        # overridden, and it drives live pentest tooling - keep it there. The
        # bundled supervisor never listens on anything else, and picks a free
        # loopback port when this one is taken.
        url: !!js "process.env.REDTEAM_MCP_URL || 'http://127.0.0.1:8787/mcp'"
        headers:
          # The console's startup token. Stable across restarts if you set
          # REDTEAM_UI_TOKEN when launching the console; otherwise copy the
          # random token it prints. It must be >= the strength floor.
          Authorization: !!js "'Bearer ' + (process.env.REDTEAM_UI_TOKEN || '')"
        failOnStartupError: true
        reconnect:
          enabled: true
          # The supervisor requires a finite budget; the schema maximum is
          # the supported equivalent of never giving up.
          maxAttempts: 9007199254740991

    # AlterEgo, the operator's PC bridge, as a FOURTH MCP client - the chat
    # surface's direct wire to the bridge, beside the engagement-only one.
    #
    # The runner already speaks to this same server inside engagements
    # (apps/redteam-runner/src/bridge/*): MCP over Streamable HTTP, the
    # paired session token carried as a bearer header. This row mirrors
    # that client's configuration exactly:
    #   - endpoint: PC_BRIDGE_URL names the bridge BASE url and defaults
    #     to loopback 127.0.0.1:8765; a bare origin gets the bridge's /mcp
    #     path appended, a URL that already carries a path is used as
    #     given, and a malformed or non-HTTP(S) value falls back to the
    #     default endpoint (the runner's resolveBridgeEndpoint /
    #     resolveBridgeConfig rules);
    #   - auth: the token is read from a FILE - the file named by
    #     PC_BRIDGE_TOKEN_FILE, or ~/.config/pc-bridge/token, the bridge's
    #     own client token location - never accepted as an env VALUE and
    #     never written in this file (the runner client's readBridgeToken
    #     rule). The header expression below reads that file when this
    #     profile composes; a missing or empty file is that client's
    #     "not paired" state and resolves the header to an empty string -
    #     the bridge answers 401, this row's connect fails and is logged,
    #     and startup proceeds (see the fail-loud note below).
    #
    # Two honest limitations, stated once: the header resolves when this
    # profile composes, so a re-pairing after app start takes effect only
    # on profile reload/restart (the runner's client, by contrast,
    # re-reads the token file on every operation); and a tools/call on a
    # write or destructive bridge op can wait on the bridge's own consent
    # dialog - a human at the PC - which is the bridge's design, not
    # something this row configures.
    #
    # Tools arrive namespaced mcp__alterego__*: whatever the bridge's live
    # registry offers (108 tools today) - the client filters nothing, the
    # same no-filtering rule the runner's bridge client follows.
    # Destructive bridge ops stay gated by the bridge's own native consent
    # dialog on the PC; this row adds reach, not authority.
    #
    # failOnStartupError is FALSE here, deliberately - the opposite choice
    # from mcp-redteam-runner above, for the opposite reason. The runner
    # is the product's core: its absence must stop startup loudly. The
    # bridge is a peripheral on the operator's machine: it may be stopped,
    # unpaired, or not installed at all, and none of that may block the
    # app from starting. A failed connect is logged by the client and the
    # mcp__alterego__* tools simply do not appear until the bridge is live
    # and paired. Do not "fix" this to true.
    - id: mcp-alterego
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: alterego
        transport: streamable-http
        url: !!js >-
          (() => { const URLCtor = process.getBuiltinModule('node:url').URL; const raw = (process.env.PC_BRIDGE_URL || '').trim() || 'http://127.0.0.1:8765'; try { const parsed = new URLCtor(raw); if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return 'http://127.0.0.1:8765/mcp'; if (parsed.pathname.replace(/\/+$/, '') === '') parsed.pathname = '/mcp'; return parsed.toString(); } catch { return 'http://127.0.0.1:8765/mcp'; } })()
        headers:
          # The paired session token, read from its file at composition
          # time (see the row comment above). The value never appears in
          # this file or in any profile source.
          Authorization: !!js >-
            (() => { try { const fs = process.getBuiltinModule('node:fs'); const path = process.getBuiltinModule('node:path'); const os = process.getBuiltinModule('node:os'); const named = (process.env.PC_BRIDGE_TOKEN_FILE || '').trim(); const file = named || path.join(os.homedir(), '.config', 'pc-bridge', 'token'); const raw = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trim() : ''; return raw === '' ? '' : 'Bearer ' + raw; } catch { return ''; } })()
        failOnStartupError: false
        reconnect:
          enabled: true
          # Copied from the runner row: the schema maximum is the
          # supported equivalent of never giving up, so a bridge restart
          # mid-session does not permanently unregister these tools.
          maxAttempts: 9007199254740991

    # The console's data channel into the chat client (Q-CONSOLE-MERGE
    # Phase 0). The console's /api surface — the A4 engagement views, the
    # live SSE feed, scope tallies, Foundry state — exists only as
    # token-gated HTTP on loopback, and the browser must hold neither the
    # endpoint nor the token. This host plugin registers same-origin share
    # routes on the Host's webServer and proxies them to the console with
    # the bearer attached inside the Host process; the client package
    # (@deepseek-ai/dsh-client-ui-redteam-console) calls only those routes.
    # Its Arsenal bridge forwards exactly the console's three read-only
    # Arsenal MCP tools; engagement-driving tools stay model-facing.
    #
    # The address and token are the very values the desktop supervisor
    # installs into this Host process's environment when it starts the
    # bundled console (the same publish mechanism the mcp-redteam-runner
    # row above reads) — no new credential plumbing. The plugin derives
    # the console base URL from the MCP form by stripping the /mcp suffix.
    # An operator-supplied console (REDTEAM_MCP_URL/REDTEAM_UI_TOKEN set)
    # is shared the same way. Secrets travel by environment name only —
    # never a raw token in this file.
    - id: redteam-console-share
      name: '@secscan/redteam-console-share'
      config:
        baseUrl: !!js "process.env.REDTEAM_MCP_URL || 'http://127.0.0.1:8787/mcp'"
        token: !!js "process.env.REDTEAM_UI_TOKEN || ''"

    # The operator's RedTeam slash commands (/scan, /status, /report,
    # /stop, /use) over the harness command registry the base layer mounts:
    # the composer's existing / menu lists them, the registry logs every
    # execution, and the handlers route deterministic operator directives
    # into the engagement flow and the Lead's real tool catalog.
    - id: command-redteam
      name: '@secscan/redteam-command'

    # The team itself. Durable session storage is the activation requirement and
    # is already mounted by dsh-base (row `session-persistence-jsonl`), so the
    # roster, mailbox and task board survive a crash, reload or restart.
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        # The starter roster is lead + recon + exploiter + reporter, but an
        # engagement is NOT capped at four: every member may spawn helpers for its
        # own slice, so a large surface can legitimately grow into a swarm - a
        # second and third exploiter per host, dedicated verifiers re-testing a
        # peer's findings, parallel report authors.
        #
        # These bounds are mirrored in the experimental agent-team-profile
        # bundle's agent-team row. Patch composition resolves a repeated plugin
        # id to the LAST layer that inserts it, so two different values would
        # make the effective ceiling depend on bundle order; identical values
        # keep the fleet bounds the same in every order.
        #
        # 100 is the widest fleet the operator runs: one member per host, shard
        # or source on a large surface, with seats left for verifiers and report
        # authors. It is a runaway guard, not the working limit - at 100 wide,
        # the bounds that bite first are the model provider's rate and token
        # limits and the host's CPU and memory, both outside this file. Raise it
        # in this row to go wider. The audit trail does not depend on this
        # number: every member, however spawned, is still an entry on the one
        # roster. (A teammate whose creation FAILED still consumes a name
        # permanently, which is part of why the guard exists at all.)
        maxMembers: 100
        # Depth is the other half of the bound: maxMembers caps how WIDE the team
        # grows, maxMemberDepth caps how DEEP. The Lead is depth 0, each specialist
        # the Lead spawns is depth 1, and a helper one of those raises is depth 2.
        # At the limit spawn_teammate is refused, so the recursion cannot run away.
        #
        # 4, not 2, deliberately. Two levels is enough for a specialist to raise a
        # helper but forbids that helper from delegating again, which is the wrong
        # ceiling for a large surface where a helper may itself need to split work.
        # Four keeps delegation genuinely recursive while still bounding the chain,
        # and the wide cap above is the real limit on engagement size: a failure
        # inside a very long chain would consume names and seats for nothing.
        maxMemberDepth: 4
        # The per-member bound sits inside those two: no member - Lead included -
        # may have more than 25 live helpers of its own at once, so one wide
        # slice cannot consume the whole roster width on its own. A creation
        # that failed never produced a helper and does not count against its
        # creator. A member that genuinely needs more than its share raises it
        # with the Lead instead of routing spawns through a peer.
        maxChildrenPerMember: 25
        # Board sized for the 100-member fleet: 1024 was the 64-member sizing
        # (16 tasks per member). 4096 keeps that headroom per member and more
        # (~41 per member), so the board refuses work (TEAM_TASK_LIMIT) only
        # after the roster itself is full - the member cap stays the single
        # width bound an operator reasons about.
        maxTasks: 4096
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        # `fresh` gives a specialist with no memory of the Lead's conversation,
        # which is right for a red-team role: each specialist gets its role
        # brief and its task, not the Lead's whole reasoning. `fork` is
        # available to the Lead for a specialist that needs the Lead's context.
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

    # Voice input: the composer's microphone, restored as shipped product
    # rows. These four rows mirror the experimental voice-input bundle's own
    # patch verbatim (same ids, names and config), the same way the Team
    # rows above mirror the agent-team profile: the voice bundle itself is
    # an optional bundle no shipped template selects, so without these rows
    # the desktop product has no dictation at all. Mounting allocates
    # nothing - the SenseVoice models download only when the operator
    # explicitly prepares them from the voice setup surface - and routing
    # stays exact: the registry never falls back to another provider, so a
    # local failure can never silently upload speech anywhere.
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local

    - id: speech-to-text-sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')

    - id: api-speech-to-text
      name: '@deepseek-ai/dsh-experimental-api-speech-to-text'

    - id: ui-voice-input
      name: '@deepseek-ai/dsh-experimental-client-ui-voice-input'

    - id: llm-local
      name: '@secscan/redteam-llm-local'

    - id: llm-meta
      name: '@secscan/redteam-llm-meta'
