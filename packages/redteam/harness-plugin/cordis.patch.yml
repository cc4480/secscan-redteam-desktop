# secscan-redteam bundle patch: mounts the red-team composition into the host
# dsh profile. One entry:
#   1. secscan-redteam — this plugin: the auth gate (tools/pre-execute hook)
#      plus the red-team engagement-protocol system-prompt section.
#
# There are NO MCP client rows in this patch anymore:
#   - SecScan scanning is native (the runner's in-process engines), and
#     domain-ownership verification is local — the app issues the challenge
#     token itself, checks the `_secscan-challenge.<domain>` DNS TXT record
#     itself, and records verified domains in a local file
#     (@secscan/redteam-auth-gate's local.ts). No SECSCAN_MCP_TOKEN exists.
#   - SecLayer testing is native — the runner's in-process suites
#     (seclayer_redteam / seclayer_bola / seclayer_api / seclayer_webhook /
#     seclayer_dast / seclayer_aggressive). The old `npx @seclayer/mcp` row
#     (an npm fetch at spawn against a hosted backend) is removed; no
#     SECLAYER_API_KEY exists.
#
# Install: `dsh plugin --profile <name> add /path/to/secscan-redteam/harness-plugin`
# then merge this file's entries into the profile's cordis.patch.yml
# (or the published package name, once published).
#
# Secrets are cordis-native: schemastery Config with env fallbacks.
# NEVER put a raw key in this file.

- insert:
    - id: secscan-redteam
      name: '@secscan/redteam-harness-plugin'
      config:
        # No plugin config needed. Verified domains come from the app's
        # LOCAL verification record alone — the app issues the challenge
        # token itself and checks the `_secscan-challenge.<domain>` DNS TXT
        # record itself (@secscan/redteam-auth-gate's local.ts). There is
        # no allowlist env var and no MCP token.
